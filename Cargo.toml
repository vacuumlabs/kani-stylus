# The library lives here. Each example under `examples/` is a standalone,
# deployable Stylus project with its own toolchain pin — exactly what
# `cargo stylus new` produces — so they are excluded rather than made members.
# That is the point of them: they show kani-stylus dropping into an ordinary
# Stylus setup, not into a bespoke workspace.
[workspace]
resolver = "2"
members = ["crates/kani-stylus-core"]
exclude = [
    "examples/counter",
    "examples/vault",
    "spikes/kani-smoke",
]
